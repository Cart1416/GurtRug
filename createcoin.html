<head>
    <title>GurtRug - Create a coin</title>
    <script src="createcoin.lua" />
    <script src="topbar.lua" />
    <style>
        body {
            bg-[#000000] text-white font-sans w-full flex flex-col
        }
        button {
            bg-[#131516] text-white px-4 py-2 rounded hover:bg-[#1e2122] transition
        }
    </style>
</head>

<body>
    <div id="sidebar" style="w-full h-[64px] max-h-[64px]">
        <img src="https://ahf2139.pythonanywhere.com/images/rugplay.png" style="w-16 h-16">
        <div style="text-xl font-bold pl-[70px] pt-[8px]">GurtRug</div>
        
        <div style="ml-auto flex gap-2 pl-[200px] pt-[14px]">
            <button id="homebutton">Home</button>
            <button id="signoutbutton">Sign out</button>
            <button id="dailymoneybutton">Claim daily money</button>
            <button id="createcoinbutton">Create a coin</button>
            <div id="moneycount">Wallet: loading</div>
        </div>
    </div>
    <br>
    <div id="content" style="flex flex-col w-full pt-[64px]">
        <div id="notification" style="self-center"></div>
        <div style="self-center"><h1 id="welcometext">Create a coin</h1></div>
        <form id="create-form" style="mx-auto">
            <input id="name" type="text" placeholder="Name (eg: Bitcoin)" required="true" style="w-full" />
            <input id="symbol" type="text" placeholder="Symbol (eg: BTC)" required="true" style="w-full" />
            <button type="submit" id="submit" style="font-medium p-3 rounded-lg w-full">Create</button>
        </form>
    </div>
</body>
